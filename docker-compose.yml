services:
  bot:
    build: .
    env_file:
      - .env
    working_dir: /app
    environment:
      PYTHONPATH: /app
    volumes:
      - .:/app
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: python -m app.main

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: coachflow
      POSTGRES_USER: coachflow
      POSTGRES_PASSWORD: coachflow_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coachflow -d coachflow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
